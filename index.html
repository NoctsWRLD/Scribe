<!doctype html>
<html lang="sl" data-theme="noc">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/scribe-logo.svg" />
    <link rel="apple-touch-icon" href="/scribe-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14120f" />
    <!-- Apply the saved theme before the first paint. Without this a visitor
         who chose the light theme sees a dark flash on every navigation.

         This script is inline on purpose: it must run before the module
         bundle. SECURITY.md carries the SHA-256 that a future
         Content-Security-Policy pins it with; recompute it if this changes. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('scribe.theme') || localStorage.getItem('smartstudy.theme');
          if (theme === 'dnevnik') root.dataset.theme = 'dnevnik';
          var saved = JSON.parse(localStorage.getItem('scribe.settings.v1') || '{}');
          root.dataset.contrast = saved.highContrast ? 'high' : 'normal';
          root.dataset.motion = saved.reduceMotion ? 'reduced' : 'full';
        } catch (error) {
          // A blocked localStorage still gets the default dark theme.
        }
      })();
    </script>
    <meta
      name="description"
      content="Scribe je šolski dnevnik: predmeti, naloge, preverjanja, urnik, kartice in prijatelji na enem mestu. Zapiši. Nauči se."
    />
    <link rel="canonical" href="https://scribeslo.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scribe" />
    <meta property="og:locale" content="sl_SI" />
    <meta property="og:title" content="Scribe — tvoj šolski dnevnik" />
    <meta
      property="og:description"
      content="Predmeti, naloge, preverjanja, urnik, kartice in prijatelji na enem mestu. Zapiši. Nauči se."
    />
    <meta property="og:url" content="https://scribeslo.vercel.app/" />
    <meta property="og:image" content="https://scribeslo.vercel.app/scribe-og.png" />
    <meta property="og:image:alt" content="Scribe — tvoj šolski dnevnik" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scribe — tvoj šolski dnevnik" />
    <meta
      name="twitter:description"
      content="Predmeti, naloge, preverjanja, urnik, kartice in prijatelji na enem mestu."
    />
    <meta name="twitter:image" content="https://scribeslo.vercel.app/scribe-og.png" />

    <title>Scribe — tvoj šolski dnevnik</title>

    <!-- The fonts are self-hosted, so they can be fetched before the CSS is
         parsed. Without this the first text is painted in the fallback face. -->
    <link
      rel="preload"
      href="/src/assets/fonts/fraunces-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/karla-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
